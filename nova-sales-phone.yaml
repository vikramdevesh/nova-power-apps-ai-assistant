- imgKpis:
    Control: Image
    Properties:
      X: =32
      Y: =96
      Width: =576
      Height: =132
      ImagePosition: =ImagePosition.Fit
      Image: |-
        =With(
            {
                e: 1 - Power(1 - Min(Coalesce(varAnim, 0), 1), 3),
                pct: If(varWonPrevQ > 0, Round((varWonQ - varWonPrevQ) / varWonPrevQ * 100, 0), 0)
            },
            "data:image/svg+xml;utf8," & EncodeUrl(
                "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 132'>" &
                "<defs><linearGradient id='t' x1='0' x2='1'><stop offset='0' stop-color='#c7d2fe'/><stop offset='1' stop-color='#67e8f9'/></linearGradient></defs>" &
                "<style>text{font-family:'Segoe UI',Arial,sans-serif}</style>" &
                "<rect x='0.5' y='0.5' width='183' height='131' rx='18' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.14)'/>" &
                "<text x='16' y='32' font-size='12' letter-spacing='1.2' fill='#94a3b8'>WON THIS QUARTER</text>" &
                "<text x='16' y='80' font-size='34' font-weight='700' fill='url(#t)'>" & "$" & If((varWonQ * e) >= 1000000, Text((varWonQ * e) / 1000000, "0.00") & "M", Text((varWonQ * e) / 1000, "0") & "K") & "</text>" &
                "<text x='16' y='110' font-size='13' fill='" & If(pct >= 0, "#4ade80", "#f87171") & "'>" & If(pct >= 0, "▲ ", "▼ ") & Abs(pct) & "% vs last quarter" & "</text>" &
                "<rect x='196.5' y='0.5' width='183' height='131' rx='18' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.14)'/>" &
                "<text x='212' y='32' font-size='12' letter-spacing='1.2' fill='#94a3b8'>OPEN PIPELINE</text>" &
                "<text x='212' y='80' font-size='34' font-weight='700' fill='url(#t)'>" & "$" & If((varPipeline * e) >= 1000000, Text((varPipeline * e) / 1000000, "0.00") & "M", Text((varPipeline * e) / 1000, "0") & "K") & "</text>" &
                "<text x='212' y='110' font-size='13' fill='" & "#94a3b8" & "'>" & CountRows(colOpen) & " open deals" & "</text>" &
                "<rect x='392.5' y='0.5' width='183' height='131' rx='18' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.14)'/>" &
                "<text x='408' y='32' font-size='12' letter-spacing='1.2' fill='#94a3b8'>WIN RATE</text>" &
                "<text x='408' y='80' font-size='34' font-weight='700' fill='url(#t)'>" & Text(varWinRate * 100 * e, "0") & "%" & "</text>" &
                "<text x='408' y='110' font-size='13' fill='" & "#94a3b8" & "'>" & varWonCount & " won · " & varLostCount & " lost" & "</text>" &
                "</svg>"
            )
        )
- imgChart:
    Control: Image
    Properties:
      X: =32
      Y: =244
      Width: =576
      Height: =250
      ImagePosition: =ImagePosition.Fit
      Image: |-
        ="data:image/svg+xml;utf8," & EncodeUrl(
            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 576 250'>" &
            "<defs>" &
                "<linearGradient id='b' x1='0' x2='1'><stop offset='0' stop-color='#6366f1'/><stop offset='1' stop-color='#22d3ee'/></linearGradient>" &
                "<linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='#16a34a'/><stop offset='1' stop-color='#86efac'/></linearGradient>" &
                "<filter id='gl' x='-20%' y='-100%' width='140%' height='300%'><feGaussianBlur stdDeviation='5'/></filter>" &
            "</defs>" &
            "<style>text{font-family:'Segoe UI',Arial,sans-serif}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}</style>" &
            "<rect x='0.5' y='0.5' width='575' height='249' rx='18' fill='rgba(255,255,255,0.04)' stroke='rgba(255,255,255,0.12)'/>" &
            "<text x='20' y='32' font-size='12' letter-spacing='1.2' fill='#94a3b8'>PIPELINE BY STAGE</text>" &
            Concat(
                colStageTotals,
                With(
                    {y: 48 + (Idx - 1) * 38, w: 8 + 300 * Total / Max(1, varMaxStage), f: If(StageName = "Closed Won", "url(#g)", "url(#b)")},
                    "<text x='20' y='" & y + 19 & "' font-size='14' fill='#cbd5e1'>" & StageName & "</text>" &
                    "<g class='bar' style='animation-delay:" & (Idx - 1) * 0.08 & "s'>" &
                    "<rect x='150' y='" & y + 5 & "' width='" & w & "' height='20' rx='10' fill='" & f & "' filter='url(#gl)' opacity='0.55'/>" &
                    "<rect x='150' y='" & y + 5 & "' width='" & w & "' height='20' rx='10' fill='" & f & "'/>" &
                    "</g>" &
                    "<text x='" & 160 + w & "' y='" & y + 20 & "' font-size='13' font-weight='600' fill='#ffffff'>$" & If((Total) >= 1000000, Text((Total) / 1000000, "0.00") & "M", Text((Total) / 1000, "0") & "K") & "</text>"
                )
            ) &
            "</svg>"
        )
- imgOrb:
    Control: Image
    Properties:
      X: =(Parent.Width - Self.Width) / 2
      Y: =500
      Width: =210
      Height: =210
      ImagePosition: =ImagePosition.Fit
      Image: |-
        =With(
            {base: Switch(
                varMood,
                "win",  {Light: "#dcfce7", Mid: "#22c55e", Deep: "#14532d"},
                "risk", {Light: "#ffedd5", Mid: "#f97316", Deep: "#9f1239"},
                {Light: "#e0e7ff", Mid: "#818cf8", Deep: "#4338ca"}
            )},
            With(
                Switch(
                    varOrbState,
                    "listening", {Light: "#ccfbf1", Mid: "#2dd4bf", Deep: "#0e7490", Breathe: "1.4s", Scale: "1.08", Spin: "6s", Ring: "0"},
                    "thinking",  {Light: "#f5d0fe", Mid: "#a855f7", Deep: "#4c1d95", Breathe: "2.4s", Scale: "1.03", Spin: "1.6s", Ring: "0.9"},
                    "speaking",  {Light: base.Light, Mid: base.Mid, Deep: base.Deep, Breathe: "0.55s", Scale: "1.1", Spin: "4s", Ring: "0"},
                    /* idle */   {Light: base.Light, Mid: base.Mid, Deep: base.Deep, Breathe: "4s", Scale: "1.04", Spin: "14s", Ring: "0"}
                ),
                "data:image/svg+xml;utf8," & EncodeUrl(
                    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'>" &
                    "<defs>" &
                        "<radialGradient id='g' cx='38%' cy='32%' r='75%'>" &
                            "<stop offset='0%' stop-color='" & Light & "'/>" &
                            "<stop offset='45%' stop-color='" & Mid & "'/>" &
                            "<stop offset='100%' stop-color='" & Deep & "'/>" &
                        "</radialGradient>" &
                        "<filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='18'/></filter>" &
                        "<filter id='soft' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='10'/></filter>" &
                        "<clipPath id='clip'><circle cx='200' cy='200' r='110'/></clipPath>" &
                    "</defs>" &
                    "<style>" &
                        ".breathe{transform-origin:200px 200px;animation:breathe " & Breathe & " ease-in-out infinite}" &
                        ".spin{transform-origin:200px 200px;animation:spin " & Spin & " linear infinite}" &
                        ".spin2{transform-origin:200px 200px;animation:spin " & Spin & " linear infinite reverse}" &
                        "@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(" & Scale & ")}}" &
                        "@keyframes spin{to{transform:rotate(360deg)}}" &
                    "</style>" &
                    "<circle class='spin' cx='200' cy='200' r='160' fill='none' stroke='" & Light & "' stroke-width='3' stroke-linecap='round' stroke-dasharray='4 18' opacity='" & Ring & "'/>" &
                    "<g class='breathe'>" &
                        "<circle cx='200' cy='200' r='120' fill='" & Mid & "' opacity='0.55' filter='url(#glow)'/>" &
                        "<circle cx='200' cy='200' r='110' fill='url(#g)'/>" &
                        "<g clip-path='url(#clip)'>" &
                            "<g class='spin' filter='url(#soft)'><ellipse cx='160' cy='155' rx='85' ry='50' fill='" & Light & "' opacity='0.75'/></g>" &
                            "<g class='spin2' filter='url(#soft)'><ellipse cx='245' cy='250' rx='80' ry='48' fill='" & Deep & "' opacity='0.65'/></g>" &
                        "</g>" &
                        "<ellipse cx='168' cy='145' rx='34' ry='20' fill='white' opacity='0.35' filter='url(#soft)'/>" &
                    "</g>" &
                    "</svg>"
                )
            )
        )
