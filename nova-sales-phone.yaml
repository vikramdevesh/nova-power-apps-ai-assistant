        )
- btnRefresh:
    Control: Classic/Button
    Properties:
      Text: ="Refresh"
      Visible: =false
      X: =560
      Y: =1100
      OnSelect: |-
        =Refresh('Nova Deals');
        ClearCollect(colPrevWon, Filter(colDeals, Stage.Value = "Closed Won"));
        ClearCollect(colDeals, 'Nova Deals');
        Set(varUpdated, Now());
        Set(varQStart, Date(Year(Today()), RoundDown((Month(Today()) - 1) / 3, 0) * 3 + 1, 1));
        Set(varPrevQStart, DateAdd(varQStart, -3, TimeUnit.Months));
        ClearCollect(colOpen, Filter(colDeals, Not(Stage.Value in ["Closed Won", "Closed Lost"])));
        Set(varWonCount, CountRows(Filter(colDeals, Stage.Value = "Closed Won")));
        Set(varLostCount, CountRows(Filter(colDeals, Stage.Value = "Closed Lost")));
        Set(varNewWonQ, Sum(Filter(colDeals, Stage.Value = "Closed Won" And CloseDate >= varQStart), Amount));
        Set(varWonPrevQ, Sum(Filter(colDeals, Stage.Value = "Closed Won" And CloseDate >= varPrevQStart And CloseDate < varQStart), Amount));
        Set(varPipeline, Sum(colOpen, Amount));
        Set(varWinRate, varWonCount / Max(1, varWonCount + varLostCount));
        ClearCollect(
            colStageTotals,
            ForAll(
                Sequence(5) As i,
                With(
                    {nm: Index(["Prospecting", "Qualification", "Proposal", "Negotiation", "Closed Won"], i.Value).Value},
                    {Idx: i.Value, StageName: nm, Total: Sum(Filter(colDeals, Stage.Value = nm), Amount)}
                )
            )
        );
        Set(varMaxStage, Max(colStageTotals, Total));
        If(varNewWonQ <> varWonQ, Set(varAnim, 0));
        If(
            varLoaded And varWonCount > CountRows(colPrevWon),
            With(
                {d: First(Filter(colDeals, Stage.Value = "Closed Won" And Not(ID in colPrevWon.ID)))},
                Set(varMood, "win");
                Set(varAnswer, "🎉 New deal won! " & d.Title & " just closed for $" & If((d.Amount) >= 1000000, Text((d.Amount) / 1000000, "0.00") & "M", Text((d.Amount) / 1000, "0") & "K") & ". You're now at $" & If((varNewWonQ) >= 1000000, Text((varNewWonQ) / 1000000, "0.00") & "M", Text((varNewWonQ) / 1000, "0") & "K") & " this quarter.");
                Set(varShown, 0);
                Set(varOrbState, "speaking")
            )
        );
        If(
            Not(varLoaded),
            Set(varQuestion, "__greet");
            Select(btnRun)
        );
        Set(varWonQ, varNewWonQ);
        Set(varLoaded, true)
- btnRun:
    Control: Classic/Button
    Properties:
      Text: ="Run Nova"
      Visible: =false
      X: =400
      Y: =1100
      OnSelect: |-
        =Set(varOrbState, "thinking");
        Set(varQ, Lower(varQuestion));
        Set(varMood, If("risk" in varQ Or "stuck" in varQ, "risk", "revenue" in varQ Or "won" in varQ Or "sales" in varQ, "win", ""));
        With(
            {
                top: First(Sort(colOpen, Amount, SortOrder.Descending)),
                risky: Sort(Filter(colOpen, DateDiff(LastActivity, Today()) > 14), Amount, SortOrder.Descending),
                soon: Sum(Filter(colOpen, CloseDate <= DateAdd(Today(), 30)), Amount * Probability / 100),
                pct: If(varWonPrevQ > 0, Round((varWonQ - varWonPrevQ) / varWonPrevQ * 100, 0), 0),
                best: First(Sort(AddColumns(GroupBy(Filter(colDeals, Stage.Value = "Closed Won" And CloseDate >= varQStart), Owner, Grp), Tot, Sum(Grp, Amount)), Tot, SortOrder.Descending))
            },
            Set(
                varAnswer,
                If(
                    varQ = "__greet",
                    "Hi, I'm Nova. I'm connected to your live SharePoint pipeline: $" & If((varWonQ) >= 1000000, Text((varWonQ) / 1000000, "0.00") & "M", Text((varWonQ) / 1000, "0") & "K") & " won this quarter and $" & If((varPipeline) >= 1000000, Text((varPipeline) / 1000000, "0.00") & "M", Text((varPipeline) / 1000, "0") & "K") & " still open. What do you want to know?",
                    "top" in varQ Or "biggest" in varQ Or "largest" in varQ,
                    "Your biggest open deal is " & top.Title & " at $" & If((top.Amount) >= 1000000, Text((top.Amount) / 1000000, "0.00") & "M", Text((top.Amount) / 1000, "0") & "K") & ". It's in " & top.Stage.Value & " with a " & top.Probability & "% win chance, owned by " & top.Owner & ", and should close on " & Text(top.CloseDate, "mmm d") & ".",
                    "risk" in varQ Or "stuck" in varQ,
                    If(
                        CountRows(risky) = 0,
                        "Good news: every open deal has had activity in the last two weeks.",
                        CountRows(risky) & " deals worth $" & If((Sum(risky, Amount)) >= 1000000, Text((Sum(risky, Amount)) / 1000000, "0.00") & "M", Text((Sum(risky, Amount)) / 1000, "0") & "K") & " have gone quiet for 14+ days. Start with " & First(risky).Title & ": $" & If((First(risky).Amount) >= 1000000, Text((First(risky).Amount) / 1000000, "0.00") & "M", Text((First(risky).Amount) / 1000, "0") & "K") & ", last touched " & DateDiff(First(risky).LastActivity, Today()) & " days ago."
                    ),
                    "forecast" in varQ Or "next month" in varQ Or "predict" in varQ,
                    "Over the next 30 days I expect about $" & If((soon) >= 1000000, Text((soon) / 1000000, "0.00") & "M", Text((soon) / 1000, "0") & "K") & " to close, weighted by win probability. That would put the quarter at roughly $" & If((varWonQ + soon) >= 1000000, Text((varWonQ + soon) / 1000000, "0.00") & "M", Text((varWonQ + soon) / 1000, "0") & "K") & ".",
                    "win rate" in varQ,
                    "Your win rate is " & Text(varWinRate * 100, "0") & "%: " & varWonCount & " deals won and " & varLostCount & " lost.",
                    "revenue" in varQ Or "won" in varQ Or "sales" in varQ Or "quarter" in varQ,
                    "You've won $" & If((varWonQ) >= 1000000, Text((varWonQ) / 1000000, "0.00") & "M", Text((varWonQ) / 1000, "0") & "K") & " this quarter, " & If(pct >= 0, "up ", "down ") & Abs(pct) & "% on last quarter. Top seller: " & best.Owner & " with $" & If((best.Tot) >= 1000000, Text((best.Tot) / 1000000, "0.00") & "M", Text((best.Tot) / 1000, "0") & "K") & ".",
                    "Right now: $" & If((varWonQ) >= 1000000, Text((varWonQ) / 1000000, "0.00") & "M", Text((varWonQ) / 1000, "0") & "K") & " won this quarter, $" & If((varPipeline) >= 1000000, Text((varPipeline) / 1000000, "0.00") & "M", Text((varPipeline) / 1000, "0") & "K") & " in open pipeline and a " & Text(varWinRate * 100, "0") & "% win rate. Ask me about your top deal, risks or the forecast."
                )
            )
        );
        Set(varShown, 0)
